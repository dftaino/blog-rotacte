<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" />
<style>html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}</style></head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Open Sans, sans-serif">
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0a63c"/><stop offset=".55" stop-color="#b8860b"/><stop offset="1" stop-color="#946c08"/>
    </linearGradient>
    <radialGradient id="brilho" cx="78%" cy="18%" r="62%">
      <stop offset="0" stop-color="#b8860b" stop-opacity=".34"/><stop offset="1" stop-color="#23201a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#23201a"/>
  <rect width="1200" height="630" fill="url(#brilho)"/>
  <g opacity=".07" stroke="#faf8f3" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M90 0v630M180 0v630M270 0v630M360 0v630M450 0v630M540 0v630M630 0v630M720 0v630M810 0v630M900 0v630M990 0v630M1080 0v630"/>
  </g>

  <!-- documento -->
  <g filter="url(#sombra)" transform="translate(120 78) rotate(-3 230 237)">
    <rect width="460" height="474" rx="20" fill="#ffffff"/>
    <rect width="460" height="66" rx="20" fill="url(#ouro)"/>
    <rect y="46" width="460" height="20" fill="#b8860b"/>
    <text x="30" y="43" font-size="24" font-weight="800" fill="#231f19">CT-e</text>
    <text x="356" y="43" font-size="17" font-weight="700" fill="#231f19">XML</text>
    <g fill="#e7e0d1">
      <rect x="30" y="102" width="288" height="15" rx="7"/>
      <rect x="30" y="136" width="400" height="15" rx="7"/>
      <rect x="30" y="170" width="352" height="15" rx="7"/>
      <rect x="30" y="228" width="188" height="15" rx="7"/>
      <rect x="30" y="262" width="400" height="15" rx="7"/>
      <rect x="30" y="296" width="330" height="15" rx="7"/>
      <rect x="30" y="354" width="270" height="15" rx="7"/>
      <rect x="30" y="388" width="392" height="15" rx="7"/>
    </g>
    <rect x="30" y="196" width="128" height="15" rx="7" fill="#d0a63c" opacity=".55"/>
    <rect x="30" y="322" width="96" height="15" rx="7" fill="#d0a63c" opacity=".55"/>
  </g>

  <!-- carimbo de rejeicao -->
  <g transform="translate(392 402) rotate(-11)" opacity=".95">
    <rect x="-140" y="-38" width="280" height="76" rx="12" fill="none" stroke="#c04a3d" stroke-width="6"/>
    <rect x="-130" y="-28" width="260" height="56" rx="7" fill="none" stroke="#c04a3d" stroke-width="2" opacity=".6"/>
    <text x="0" y="12" text-anchor="middle" font-size="34" font-weight="800" fill="#c04a3d" letter-spacing="3">REJEITADO</text>
  </g>

  <!-- painel de retorno da sefaz -->
  <g transform="translate(650 128)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#c9bda6" letter-spacing="2.5">RETORNO DA SEFAZ</text>

    <g transform="translate(0 34)">
      <rect width="430" height="86" rx="14" fill="#2e2a22" stroke="#4b4438"/>
      <circle cx="42" cy="43" r="20" fill="#2e6b47"/>
      <path d="M33 43l7 8 14-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="38" font-size="25" font-weight="800" fill="#faf8f3">100 · Autorizado</text>
      <text x="78" y="66" font-size="17" fill="#a99e8c">documento válido, com protocolo</text>
    </g>

    <g transform="translate(0 142)">
      <rect width="430" height="86" rx="14" fill="#2e2a22" stroke="#4b4438"/>
      <circle cx="42" cy="43" r="20" fill="#c04a3d"/>
      <path d="M34 35l16 16M50 35l-16 16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="78" y="38" font-size="25" font-weight="800" fill="#faf8f3">Rejeição</text>
      <text x="78" y="66" font-size="17" fill="#a99e8c">corrija o XML e envie de novo</text>
    </g>

    <g transform="translate(0 250)">
      <rect width="430" height="86" rx="14" fill="#2e2a22" stroke="#4b4438"/>
      <circle cx="42" cy="43" r="20" fill="#9a6a12"/>
      <path d="M42 31v16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="42" cy="55" r="3.2" fill="#fff"/>
      <text x="78" y="38" font-size="25" font-weight="800" fill="#faf8f3">Denegação</text>
      <text x="78" y="66" font-size="17" fill="#a99e8c">é cadastro, não é o arquivo</text>
    </g>
  </g>
</svg>
</body></html>
